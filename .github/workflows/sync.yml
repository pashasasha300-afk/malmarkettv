name: Maintain channel directory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - scripts/sync.mjs
      - scripts/normalize.mjs
      - scripts/common.mjs
      - src/public-config.json
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: write
concurrency:
  group: channel-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - run: npm run check:connection
      - run: npm run health
      - name: Refresh public SEO snapshot
        run: |
          git pull --rebase origin main
          npm run seo:snapshot
          if ! git diff --quiet -- seo/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo/catalog.json
            git commit -m "Refresh public SEO catalogue after channel sync"
            git push origin HEAD:main
          fi
